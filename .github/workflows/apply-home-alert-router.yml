name: Apply home alert router

on:
  push:
    branches:
      - chatgpt/home-alert-reliability-20260809

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[home-alert-router-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/home-alert-reliability-20260809
      - name: Patch API router
        shell: python
        run: |
          from pathlib import Path
          p = Path('api/main.py')
          text = p.read_text(encoding='utf-8-sig')
          import_anchor = 'from . import fox_messages as fox_messages_store\n'
          import_line = 'from .home_alerts import router as home_alerts_router\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('home alert import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          app_anchor = 'app = FastAPI()\n'
          include_line = 'app.include_router(home_alerts_router)\n'
          if include_line not in text:
              if app_anchor not in text:
                  raise SystemExit('FastAPI app anchor not found')
              text = text.replace(app_anchor, app_anchor + include_line, 1)
          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/apply-home-alert-router.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/main.py .github/workflows/apply-home-alert-router.yml
          git commit -m "Wire durable home alert router [home-alert-router-applied]"
          git push
