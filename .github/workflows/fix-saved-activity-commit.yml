name: Fix saved activity commit
on:
  push:
    paths:
      - .github/workflows/fix-saved-activity-commit.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix and validate
        run: |
          sed -i 's/con\.comit()/con.commit()/g' api/team_games.py
          python -m py_compile api/team_games.py api/main.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/team_games.py
          git diff --cached --quiet || git commit -m "Fix saved activity updates"
          git pull --rebase origin main
          git push origin HEAD:main
