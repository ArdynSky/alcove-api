name: Work manual Debate registration
on:
  push:
    branches:
      - work/debate-manual-registration-20260818
    paths:
      - '.github/workflows/work-manual-debate-registration.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Debate registration host-controlled
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/debate_games.py')
          s = p.read_text()
          old = '''    if state.get("status") == "pooling":\n        end = _parse(state.get("registration_ends_at"))\n        if end and end <= now:\n            state["status"] = "registration_closed"\n            changed = True\n'''
          if old not in s:
              raise SystemExit('pooling expiry block not found')
          s = s.replace(old, '')
          s = s.replace('"registration_ends_at": _iso(now + timedelta(seconds=registration_seconds)),', '"registration_ends_at": None,')
          s = s.replace('state["registration_ends_at"] = _iso()\n    _save(state)\n    return _public(state)', 'state["registration_ends_at"] = None\n    _save(state)\n    return _public(state)', 1)
          s = s.replace('state["registration_ends_at"] = _iso()\n    _save(state)\n    return _public(state)\n\n\ndef _start_turn', 'state["registration_ends_at"] = None\n    _save(state)\n    return _public(state)\n\n\ndef _start_turn', 1)
          p.write_text(s)
          PY
      - name: Commit work-branch patch
        run: |
          git config user.name "alcove-work-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/debate_games.py
          git diff --cached --quiet || git commit -m "Make Debate registration manual"
          git push
