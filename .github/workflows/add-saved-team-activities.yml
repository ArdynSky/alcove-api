name: Add saved activity library
on:
  push:
    paths:
      - .github/workflows/add-saved-team-activities.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch team game API
        env:
          TEMPLATE_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os
          p=Path('api/team_games.py')
          s=p.read_text()
          # Keep old backgrounds because saved activities may reference them.
          s=s.replace("    if old:\n        try:\n            (BACKGROUND_DIR / Path(old).name).unlink(missing_ok=True)\n        except Exception:\n            pass\n    return _public_state(state)\n\n\n@router.delete(\"/background\")", "    return _public_state(state)\n\n\n@router.delete(\"/background\")", 1)
          s=s.replace("    if old:\n        try:\n            (BACKGROUND_DIR / Path(old).name).unlink(missing_ok=True)\n        except Exception:\n            pass\n    return _public_state(state)\n\n\n@router.get(\"/background-media/{filename}\")", "    return _public_state(state)\n\n\n@router.get(\"/background-media/{filename}\")", 1)
          if 'class ActivityTemplatePayload' not in s:
              s += base64.b64decode(os.environ['TEMPLATE_B64']).decode()
          p.write_text(s)
          PY
          python -m py_compile api/team_games.py api/main.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/team_games.py
          git diff --cached --quiet || git commit -m "Add reusable saved activity library"
          git pull --rebase origin main
          git push origin HEAD:main
