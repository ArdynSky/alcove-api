name: Question game checks
on:
  push:
    branches: [codex/live-question-games]
  pull_request:
    paths: ['api/**', 'tests/**', '.github/workflows/question-games.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r api/requirements.txt pytest httpx
      - name: Question game behavior
        run: python -m pytest tests/test_question_games.py -q
      - name: Existing tests
        if: always()
        run: python -m pytest -q --ignore=tests/test_question_games.py
