name: Apply team game router
on:
  push:
    branches: [agent/team-chat-drawing-game]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/team-chat-drawing-game
      - name: Patch main router registration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/main.py')
          s=p.read_text()
          if 'from .team_games import router as team_games_router' not in s:
              s=s.replace('from .home_alerts import router as home_alerts_router\n','from .home_alerts import router as home_alerts_router\nfrom .team_games import router as team_games_router\n',1)
          if 'app.include_router(team_games_router)' not in s:
              s=s.replace('app.include_router(home_alerts_router)\n','app.include_router(home_alerts_router)\napp.include_router(team_games_router)\n',1)
          p.write_text(s)
          PY
      - name: Validate Python
        run: python -m py_compile api/main.py api/team_games.py
      - name: Commit integration
        run: |
          rm -f .github/workflows/apply-team-game-router.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Register private team game API router"
          git push
