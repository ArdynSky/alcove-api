name: Check team game background
on:
  push:
    paths:
      - .github/workflows/check-team-game-background.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile api/team_games.py api/main.py
