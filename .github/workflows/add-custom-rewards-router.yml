name: Wire custom rewards router
on:
  push:
    paths:
      - .github/workflows/add-custom-rewards-router.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch main
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/main.py')
          s=p.read_text()
          imp='from .team_games import router as team_games_router\n'
          add='from .custom_rewards import router as custom_rewards_router\n'
          if add not in s:
              s=s.replace(imp, imp+add, 1)
          inc='app.include_router(team_games_router)\n'
          addinc='app.include_router(custom_rewards_router)\n'
          if addinc not in s:
              s=s.replace(inc, inc+addinc, 1)
          p.write_text(s)
          PY
          python -m py_compile api/custom_rewards.py api/main.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/main.py
          git diff --cached --quiet || git commit -m "Wire custom reward pack endpoints"
          git pull --rebase origin main
          git push origin HEAD:main
